version: "3.8"

services:
  openvpn:
    image: kylemanna/openvpn
    container_name: openvpn
    cap_add:
      - NET_ADMIN
    ports:
      - "7777:1194/udp" # Maps container's 1194 (OpenVPN) to host's 7777
    volumes:
      - ovpn-data:/etc/openvpn
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      labels:
        - "traefik.enable=false"
    networks:
      - public

  openvpn-admin:
    image: flant/openvpn-admin
    container_name: openvpn-admin
    depends_on:
      - openvpn
    environment:
      OVPN_DEBUG: "true"
      OVPN_VERBOSE: "true"
      OVPN_NETWORK: "192.168.100.0/24"
      OVPN_CCD: "true"
      OVPN_CCD_PATH: "/mnt/ccd"
      EASYRSA_PATH: "/mnt/easyrsa"
      # In Swarm, instead of network_mode, we reference the OpenVPN service by its DNS name.
      OVPN_SERVER: "openvpn:1194"
      OVPN_INDEX_PATH: "/mnt/easyrsa/pki/index.txt"
      OVPN_AUTH: "true"
      OVPN_AUTH_DB_PATH: "/mnt/easyrsa/pki/users.db"
      LOG_LEVEL: "debug"
    volumes:
      # Mount the same ovpn-data volume to supply the admin panel with the easyrsa and CCD data.
      - ovpn-data:/mnt/easyrsa
      - ovpn-data:/mnt/ccd
      - openvpn-admin-data:/data
    ports:
      - "8080:8080"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.openvpn-admin.rule=Host(`vpn.andyrum.com`)"
        - "traefik.http.routers.openvpn-admin.entrypoints=websecure"
        - "traefik.http.services.openvpn-admin.loadbalancer.server.port=8080"
        - "traefik.http.routers.openvpn-admin.service=openvpn-admin"
        - "traefik.http.routers.openvpn-admin.tls.certresolver=leresolver"
    networks:
      - public

volumes:
  ovpn-data:
  openvpn-admin-data:

networks:
  public:
    external: true
