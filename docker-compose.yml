version: "3.8"

services:
  wireguard:
    image: linuxserver/wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SERVERURL=vpn.andyrum.com
      - SERVERPORT=51820
      - PEERS=5
      - PEERDNS=8.8.8.8
      - INTERNAL_SUBNET=10.13.13.0 # Internal VPN range
    volumes:
      - wireguard-data:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.forwarding=1
      - net.ipv6.conf.all.forwarding=1
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      labels:
        - "traefik.enable=false"
    networks:
      - public

  wg-easy:
    image: weejewel/wg-easy
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - WG_HOST=wireguard
      - PASSWORD_HASH=$2a$12$pvxELQk0CUnmKGxVKIIZ7Onmopwe.W9KuEw9X8ZASXwPA/hxZhtg.
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - wireguard-data:/etc/wireguard
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wg-easy.rule=Host(`vpnadmin.andyrum.com`)"
      - "traefik.http.routers.wg-easy.entrypoints=websecure"
      - "traefik.http.services.wg-easy.loadbalancer.server.port=51821"
      - "traefik.http.routers.wg-easy.service=wg-easy"
      - "traefik.http.routers.wg-easy.tls.certresolver=leresolver"
    networks:
      - public

volumes:
  wireguard-data:

networks:
  public:
    external: true
